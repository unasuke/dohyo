name: Interop

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    name: Interop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Knot DNS and BIND's tools, and the libraries for building protocol-quic
        run: |
          sudo apt-get update
          packages="knot bind9-utils"
          # rugged, which protocol-quic's build tool depends on, links OpenSSL statically. From Ubuntu 26.04 on, that
          # needs libjitterentropy.a and libzstd; Ubuntu 24.04 has no libjitterentropy3-dev.
          if pkg-config --static --libs libcrypto | grep -q jitterentropy; then
            packages="$packages libjitterentropy3-dev libzstd-dev"
          fi
          sudo apt-get install -y --no-install-recommends $packages
      # Release binaries at fixed versions, checked against their SHA-256. q publishes checksums; dnsproxy does not, so
      # its hash was taken from the release archive when the version was pinned.
      - name: Install q and dnsproxy
        env:
          Q_VERSION: 0.19.12
          Q_SHA256: 4adfaa55594a68d8aec60348aaa6345d5232701a1c05ac144ad3fd12dc291f7a
          DNSPROXY_VERSION: 0.86.0
          DNSPROXY_SHA256: 17ac43f76ebfcedf547c663f6f31aa70e68b8eb6fc41d2fc37d3bfe21a2ced66
        run: |
          cd "$RUNNER_TEMP"
          mkdir bin
          curl -fsSL -o q.tar.gz "https://github.com/natesales/q/releases/download/v${Q_VERSION}/q_${Q_VERSION}_linux_amd64.tar.gz"
          echo "${Q_SHA256}  q.tar.gz" | sha256sum -c -
          tar -xzf q.tar.gz -C bin q
          curl -fsSL -o dnsproxy.tar.gz "https://github.com/AdguardTeam/dnsproxy/releases/download/v${DNSPROXY_VERSION}/dnsproxy-linux-amd64-v${DNSPROXY_VERSION}.tar.gz"
          echo "${DNSPROXY_SHA256}  dnsproxy.tar.gz" | sha256sum -c -
          tar -xzf dnsproxy.tar.gz --strip-components=2 -C bin ./linux-amd64/dnsproxy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      # rake interop:compliance builds it too; built here first so that its log stands apart from the tests'.
      - name: Build the genreport image
        run: docker build -t dohyo-genreport test/interop/genreport
      - name: Check against other implementations and tools
        run: bundle exec rake interop
